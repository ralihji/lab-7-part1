<div>
  <h2>Search our Authors</h2>
  <form [formGroup]="searchForm" (ngSubmit)="onSubmit()" novalidate>
    <label for="authorId">Author Id:</label>
    <input type="text" id="authorId" formControlName="authorId">
    <button type="submit">Search</button>
    @if (showError) {
      <div class="alert alert-danger">{{ validationMessage }}</div>
    }
  </form>
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>
